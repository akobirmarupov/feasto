# ASOSIY (production) konfiguratsiya.
# Mahalliy ishlash uchun docker-compose.override.yml avtomatik qo'shiladi
# (bind mount + ochiq portlar). Serverda override QO'SHILMASLIGI kerak:
#   docker compose -f docker-compose.yml up -d

services:

  # --- Django ilovasi ---
  web:
    build: .
    # command berilmagan — Dockerfile dagi CMD (gunicorn) ishlatiladi.
    # Migratsiya va collectstatic FAQAT shu konteynerda bajariladi.
    environment:
      RUN_MIGRATIONS: "1"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- PostgreSQL ma'lumotlar bazasi ---
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # --- Redis (kesh, sessiya va Celery broker) ---
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Celery worker ---
  celery:
    build: .
    command: celery -A config worker -l info
    # Image dagi HEALTHCHECK HTTP port 8000 ni tekshiradi — worker veb-server
    # emas, shuning uchun o'chiriladi. Worker va beat tirikligini /api/health/
    # dagi "celery" maydoni ko'rsatadi (heartbeat beat yuboradi, worker bajaradi).
    healthcheck:
      disable: true
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  # --- Celery beat (davriy vazifalar). FAQAT BITTA NUSXA ishlashi shart. ---
  celery-beat:
    build: .
    command: celery -A config beat -l info
    healthcheck:
      disable: true
    volumes:
      - logs_volume:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  # --- Nginx (reverse proxy, tashqariga chiqadigan yagona eshik) ---
  #   /static/  ->  static_volume (web da /app/staticfiles)
  #   /media/   ->  media_volume  (web da /app/media)
  #   80/443 portlarini faqat nginx chiqaradi, web emas.
  # Let's Encrypt faqat 80-port orqali tekshiradi, shuning uchun bu yerda 80.
  # Mahalliy kompyuterda port override faylida 8080 ga almashtiriladi.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro

      # Let's Encrypt uchun ikkita papka.
      - ./deploy/nginx/certbot/www:/var/www/certbot:ro
      - ./deploy/nginx/certbot/conf:/etc/letsencrypt:ro

    depends_on:
      web:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      # Bu yerda :ro YO'Q, certbot yozishi kerak.
      - ./deploy/nginx/certbot/conf:/etc/letsencrypt
      - ./deploy/nginx/certbot/www:/var/www/certbot

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume: